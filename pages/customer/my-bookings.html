<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — PaaniLink</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
<div class="app-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Top Header -->
    <header class="top-header">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <button class="hamburger-btn" id="hamburger-btn">☰</button>
        <span class="page-title" id="page-title">My Bookings</span>
      </div>
      <div class="header-right">
        <span>👤 <strong id="header-user"></strong></span>
        <span id="header-date"></span>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">

      <!-- Action & Filter Bar -->
      <div class="card" style="margin-bottom: 1.5rem;">
        <div class="card-body">
          <div class="filter-bar" style="margin-bottom: 0;">
            
            <div class="search-input-wrapper">
              <span class="search-icon">🔍</span>
              <input type="text" id="search-input" placeholder="Search by Booking ID or Address..." />
            </div>

            <div style="min-width: 180px;">
              <select id="status-filter">
                <option value="">All Statuses</option>
                <option value="pending_approval">Awaiting Approval</option>
                <option value="approved">Approved / In Queue</option>
                <option value="assigned">Tanker Assigned</option>
                <option value="dispatched">Dispatched / En Route</option>
                <option value="delivered">Delivered</option>
                <option value="completed">Completed</option>
                <option value="rejected">Rejected</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>

            <div style="min-width: 150px;">
              <select id="type-filter">
                <option value="">All Types</option>
                <option value="commercial">Commercial</option>
                <option value="subsidised">Subsidised</option>
              </select>
            </div>

            <a href="booking.html" class="btn btn-primary">
              💧 New Booking
            </a>

          </div>
        </div>
      </div>

      <div id="booking-list-alert" style="display:none;"></div>

      <!-- Bookings Table Card -->
      <div class="card">
        <div class="card-header">
          <h3>📋 Booking Records</h3>
          <span id="record-count" style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">Loading records...</span>
        </div>
        <div class="card-body" style="padding: 0;">
          <div id="bookings-table-container">
            <div class="spinner-wrapper"><div class="spinner"></div> Loading bookings...</div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Booking Details Modal -->
<div class="modal-overlay" id="details-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Booking Details</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-content">
      <!-- Injected via JS -->
    </div>
    <div class="modal-footer" id="modal-actions">
      <!-- Injected via JS -->
    </div>
  </div>
</div>

<div id="toast-container"></div>

<!-- Scripts -->
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/nav.js"></script>
<script>
  const user = initDashboardPage('customer', 'My Bookings');
  if (!user) throw new Error('Not authenticated');

  document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-PK', {
    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
  });

  let allCustomerBookings = [];

  async function loadBookings() {
    try {
      allCustomerBookings = await BookingsAPI.getByCustomer(user.id);
      applyFilters();
    } catch (err) {
      showAlert('booking-list-alert', 'Failed to retrieve bookings from server.', 'error');
    }
  }

  function applyFilters() {
    const query = document.getElementById('search-input').value.trim().toLowerCase();
    const statusVal = document.getElementById('status-filter').value;
    const typeVal = document.getElementById('type-filter').value;

    const filtered = allCustomerBookings.filter(b => {
      const matchSearch = (b.id && b.id.toLowerCase().includes(query)) ||
                          (b.deliveryAddress && b.deliveryAddress.toLowerCase().includes(query));
      const matchStatus = !statusVal || b.status === statusVal;
      const matchType = !typeVal || b.bookingType === typeVal;
      return matchSearch && matchStatus && matchType;
    });

    renderBookingsTable(filtered);
  }

  document.getElementById('search-input').addEventListener('input', applyFilters);
  document.getElementById('status-filter').addEventListener('change', applyFilters);
  document.getElementById('type-filter').addEventListener('change', applyFilters);

  function renderBookingsTable(bookings) {
    const container = document.getElementById('bookings-table-container');
    const countEl = document.getElementById('record-count');
    countEl.textContent = `${bookings.length} record${bookings.length === 1 ? '' : 's'}`;

    if (!bookings.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <h4>No bookings match your criteria</h4>
          <p>Book a water tanker now to receive quick delivery.</p>
          <a href="booking.html" class="btn btn-primary" style="margin-top: 1rem;">💧 Book Tanker</a>
        </div>`;
      return;
    }

    const rows = bookings.slice().reverse().map(b => {
      const isDeliverable = b.status === 'delivered';
      const isTrackable = ['approved', 'assigned', 'filling', 'dispatched', 'delivered'].includes(b.status);

      return `
        <tr>
          <td>
            <strong><a href="javascript:void(0)" onclick="openDetails('${b.id}')">${escapeHtml(b.id)}</a></strong>
            <div style="font-size: 0.75rem; color: rgba(255,255,255,0.4);">${formatDate(b.createdAt)}</div>
          </td>
          <td>${makeBadge(b.bookingType)}</td>
          <td>${b.capacity.toLocaleString()} gal</td>
          <td>
            <div>${b.preferredDate}</div>
            <div style="font-size: 0.75rem; color: rgba(255,255,255,0.5);">${b.preferredTime}</div>
          </td>
          <td>${formatCurrency(b.price)}</td>
          <td>${makeBadge(b.status)}</td>
          <td>
            <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
              <button class="btn btn-sm btn-secondary" onclick="openDetails('${b.id}')">View</button>
              ${isTrackable ? `<a href="tracking.html?id=${b.id}" class="btn btn-sm btn-info">Track</a>` : ''}
              ${isDeliverable ? `<button class="btn btn-sm btn-success" onclick="confirmDelivery('${b.id}')">Confirm</button>` : ''}
            </div>
          </td>
        </tr>`;
    }).join('');

    container.innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Type</th>
              <th>Capacity</th>
              <th>Scheduled</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function openDetails(bookingId) {
    const booking = allCustomerBookings.find(b => b.id === bookingId);
    if (!booking) return;

    document.getElementById('modal-title').textContent = `Booking Details — ${booking.id}`;
    
    const canCancel = ['pending_approval', 'approved'].includes(booking.status) && !booking.tripId;
    const isDeliverable = booking.status === 'delivered';

    let contentHtml = `
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
        <div>
          <label style="color: rgba(255,255,255,0.5);">Booking ID</label>
          <div style="font-weight: 700; font-size: 1.1rem; color: white;">${escapeHtml(booking.id)}</div>
        </div>
        <div>
          <label style="color: rgba(255,255,255,0.5);">Current Status</label>
          <div>${makeBadge(booking.status)}</div>
        </div>
        <div>
          <label style="color: rgba(255,255,255,0.5);">Booking Type</label>
          <div>${makeBadge(booking.bookingType)}</div>
        </div>
        <div>
          <label style="color: rgba(255,255,255,0.5);">Capacity</label>
          <div style="font-weight: 600;">${booking.capacity.toLocaleString()} Gallons</div>
        </div>
        <div>
          <label style="color: rgba(255,255,255,0.5);">Scheduled Date & Time</label>
          <div>${booking.preferredDate} at ${booking.preferredTime}</div>
        </div>
        <div>
          <label style="color: rgba(255,255,255,0.5);">Total Amount</label>
          <div style="font-weight: 700; color: #7dd3fc; font-size: 1.1rem;">${formatCurrency(booking.price)}</div>
        </div>
      </div>

      <div style="margin-bottom: 1rem;">
        <label style="color: rgba(255,255,255,0.5);">Delivery Address</label>
        <div style="background: rgba(255,255,255,0.06); padding: 0.75rem; border-radius: 8px; font-size: 0.9rem;">
          ${escapeHtml(booking.deliveryAddress)}
        </div>
      </div>

      ${booking.instructions ? `
      <div style="margin-bottom: 1rem;">
        <label style="color: rgba(255,255,255,0.5);">Special Instructions</label>
        <div style="font-size: 0.88rem; color: rgba(255,255,255,0.7);">${escapeHtml(booking.instructions)}</div>
      </div>` : ''}

      ${booking.rejectionReason ? `
      <div class="alert alert-error" style="margin-top: 1rem;">
        <strong>Officer Rejection Reason:</strong><br>${escapeHtml(booking.rejectionReason)}
      </div>` : ''}
    `;

    document.getElementById('modal-content').innerHTML = contentHtml;

    // Action buttons
    let actionButtons = `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`;
    
    if (canCancel) {
      actionButtons += `<button class="btn btn-danger" onclick="cancelBooking('${booking.id}')">Cancel Booking</button>`;
    }
    if (isDeliverable) {
      actionButtons += `
        <a href="disputes.html?bookingId=${booking.id}" class="btn btn-warning">Report Dispute</a>
        <button class="btn btn-success" onclick="confirmDelivery('${booking.id}')">Confirm Delivery</button>
      `;
    }

    document.getElementById('modal-actions').innerHTML = actionButtons;
    document.getElementById('details-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('details-modal').classList.remove('open');
  }

  async function cancelBooking(bookingId) {
    if (!confirmAction(`Are you sure you want to cancel booking ${bookingId}?`)) return;

    try {
      await BookingsAPI.update(bookingId, { status: 'cancelled' });
      showToast('Booking cancelled successfully', 'info');
      closeModal();
      loadBookings();
    } catch (err) {
      showToast('Failed to cancel booking: ' + err.message, 'error');
    }
  }

  async function confirmDelivery(bookingId) {
    if (!confirmAction(`Confirm that water tanker for ${bookingId} was successfully delivered?`)) return;

    try {
      // 1. Update Booking status to completed
      await BookingsAPI.update(bookingId, { status: 'completed' });

      // 2. Update trip if linked
      const trips = await TripsAPI.getByBooking(bookingId);
      if (trips && trips.length > 0) {
        await TripsAPI.update(trips[0].id, {
          deliveryStatus: 'delivered',
          customerConfirmed: true
        });
      }

      showToast('Delivery confirmed! Thank you.', 'success');
      closeModal();
      loadBookings();
    } catch (err) {
      showToast('Confirmation failed: ' + err.message, 'error');
    }
  }

  loadBookings();
</script>
</body>
</html>
